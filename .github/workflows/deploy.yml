name: Test, Build, and Deploy

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - run: npm ci
      - run: npm run test:run

      - name: Create env file for e2e
        run: echo "VITE_BACKEND_URL=${{ secrets.VITE_BACKEND_URL }}" > .env.production

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - run: npm run play

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create env file for build
        run: echo "VITE_BACKEND_URL=${{ secrets.VITE_BACKEND_URL }}" > client/.env.production

      - name: Build client via Docker Compose
        run: docker compose -f docker-compose.prod.yml run --rm client-build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Sync to S3
        run: aws s3 sync ./client/dist s3://${{ secrets.S3_BUCKET }} --delete